            --muted:     #6b675d;

            --ink-soft:  #d8d3c8;
            --muted:     #948f84;
            --line:      #f3efe6;
            --line-soft: #3a3a44;
            --accent:    #e8a317;
            --accent-d:  #f2b43a;
            --danger:    #ff7a5c;
            --success:   #57ab6e;
        }

        /* ── 主题切换按钮（包豪斯月相） ── */
        .theme-toggle {
            width: 34px; height: 34px; flex-shrink: 0;
            background: transparent; border: 1.5px solid var(--line);
            cursor: pointer; display: grid; place-items: center; padding: 0;
            transition: background-color .15s, border-color .15s;
        }
        .theme-toggle:hover { background: var(--accent); border-color: var(--accent); }
        .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .tt-icon {
            width: 14px; height: 14px; border-radius: 50%; background: transparent;
            box-shadow: inset 5px -3px 0 0 var(--ink); transition: box-shadow .2s, background-color .2s;
        }
        [data-theme="dark"] .tt-icon { background: var(--accent); box-shadow: none; }
        .theme-toggle:hover .tt-icon { box-shadow: inset 5px -3px 0 0 #16161a; }
        [data-theme="dark"] .theme-toggle:hover .tt-icon { box-shadow: none; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--ink); line-height: 1.6;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
        }
        a { color: var(--ink); }
        ::selection { background: var(--accent); color: var(--ink); }

        /* ── 导航 ── */
        nav {
            position: sticky; top: 0; z-index: 100; background: var(--bg);
            border-bottom: 1.5px solid var(--line);
        }
        .nav-inner {
            max-width: 1000px; margin: 0 auto; padding: 0.9rem 1.6rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
        }
        .logo {
            display: flex; align-items: center; gap: 0.65rem;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem;
            color: var(--ink); text-decoration: none; letter-spacing: -0.01em;
        }
        .logo img { width: 28px; height: 28px; display: block; }
        .nav-right { display: flex; align-items: center; gap: 0.8rem; }
        .lang-toggle {
            background: transparent; color: var(--ink); border: 1.5px solid var(--line);
            padding: 0.35rem 0.8rem; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; cursor: pointer;
        }
        .lang-toggle:hover { background: var(--ink); color: var(--bg); }
        .nav-cta {
            background: var(--ink); color: var(--bg); padding: 0.45rem 1.1rem;
            font-family: 'Space Grotesk', sans-serif; font-size: 0.8rem; font-weight: 600;
            letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none;
            border: 1.5px solid var(--ink);
        }
        .nav-cta:hover { background: var(--accent); border-color: var(--accent); color: var(--ink); }

        /* ── 通用 ── */
        .label {
            font-family: 'Space Grotesk', sans-serif; font-size: 0.78rem; font-weight: 600;
            letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
            display: inline-flex; align-items: center; gap: 0.6rem;
        }
        .label::before { content: ""; display: inline-block; width: 10px; height: 10px; background: var(--accent); }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 0 1.6rem; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.85rem 1.5rem; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            text-decoration: none; cursor: pointer; border: 1.5px solid var(--ink);
        }
        .btn-primary { background: var(--ink); color: var(--bg); }
        .btn-primary:hover { background: var(--accent); color: var(--ink); border-color: var(--accent); }

        /* ── 功能详情 ── */
        .feat-hero {
            padding: 4rem 0 2.4rem; border-bottom: 1.5px solid var(--line);
        }
        .feat-icon {
            width: 56px; height: 56px; border: 1.5px solid var(--ink);
            display: flex; align-items: center; justify-content: center; margin-bottom: 1.4rem;
        }
        .feat-icon svg { width: 30px; height: 30px; }
        .feat-tag {
            display: inline-block; margin-bottom: 0.8rem;
            font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; font-weight: 700;
            letter-spacing: 0.12em; text-transform: uppercase; padding: 0.2rem 0.6rem;
            background: var(--accent); color: var(--ink);
        }
        .feat-hero h1 {
            font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; color: var(--ink);
            margin-bottom: 1.1rem; max-width: 18ch;
        }
        .feat-lede { color: var(--ink-soft); font-size: 1.08rem; max-width: 680px; line-height: 1.7; }

        .feat-body { padding: 3.5rem 0 1rem; }
        .feat-section { margin-bottom: 3.2rem; }
        .feat-section > .label { margin-bottom: 1.3rem; }

        .points { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1.5px solid var(--line); border-left: 1.5px solid var(--line); }
        .point {
            border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line);
            padding: 1.5rem 1.6rem; background: var(--bg);
        }
        .point h3 {
            font-family: 'Space Grotesk', sans-serif; font-size: 1.02rem; font-weight: 600;
            margin-bottom: 0.55rem; color: var(--ink); letter-spacing: -0.01em;
        }
        .point p { color: var(--ink-soft); font-size: 0.92rem; line-height: 1.65; }

        /* 工作原理 */
        .how { background: var(--paper); border: 1.5px solid var(--line); padding: 1.6rem 1.9rem; margin-top: 0.2rem; }
        .how p { color: var(--ink-soft); font-size: 0.98rem; line-height: 1.8; max-width: 72ch; }

        /* 使用场景 */
        .uc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1.5px solid var(--line); border-left: 1.5px solid var(--line); }
        .uc {
            border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line);
            padding: 1.4rem 1.6rem; background: var(--bg);
        }
        .uc h3 { font-family: 'Space Grotesk', sans-serif; font-size: 0.98rem; font-weight: 600; margin-bottom: 0.45rem; color: var(--ink); }
        .uc p { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.6; }

        /* 模板网格 */
        .tpl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1.5px solid var(--line); border-left: 1.5px solid var(--line); }
        .tpl {
            border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line);
            padding: 1.4rem 1.6rem; background: var(--bg); display: flex; gap: 1rem; align-items: flex-start;
        }
        .tpl-emoji { font-size: 1.6rem; line-height: 1; flex-shrink: 0; }
        .tpl h3 { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--ink); }
        .tpl p { color: var(--ink-soft); font-size: 0.88rem; line-height: 1.55; }

        /* 工作流示例 */
        .flow {
            border: 1.5px solid var(--line); background: var(--paper); padding: 1.6rem 1.8rem;
        }
        .flow-step {
            display: flex; gap: 1rem; padding: 0.8rem 0; border-bottom: 1px solid var(--line-soft);
            align-items: flex-start;
        }
        .flow-step:last-child { border-bottom: none; }
        .flow-num {
            flex-shrink: 0; width: 26px; height: 26px; background: var(--ink); color: var(--bg);
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.8rem;
            display: grid; place-items: center;
        }
        .flow-step p { font-size: 0.92rem; color: var(--ink-soft); line-height: 1.6; }
        .flow-step b { color: var(--ink); }

        /* 护栏 */
        .guard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1.5px solid var(--line); border-left: 1.5px solid var(--line); }
        .guard-item {
            border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line);
            padding: 1.3rem 1.6rem; background: var(--bg); display: flex; gap: 0.8rem; align-items: flex-start;
        }
        .guard-item .dot { width: 10px; height: 10px; background: var(--accent); margin-top: 0.45rem; flex-shrink: 0; }
        .guard-item p { font-size: 0.9rem; color: var(--ink-soft); line-height: 1.6; }
        .guard-item b { color: var(--ink); }

        .feat-foot {
            border-top: 1.5px solid var(--line); padding: 3rem 0 4rem; text-align: center;
        }
        .feat-foot h2 {
            font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            font-weight: 700; color: var(--ink); margin-bottom: 1.4rem; letter-spacing: -0.01em;
        }
        .back-link {
            display: inline-block; margin-top: 2.5rem; color: var(--ink); font-size: 0.85rem;
            text-decoration: none; border-bottom: 1.5px solid var(--line); padding-bottom: 2px;
        }
        .back-link:hover { background: var(--accent); }

        footer { padding: 2.2rem 1.6rem; text-align: center; color: var(--muted); font-size: 0.84rem; border-top: 1.5px solid var(--line); }
        footer a { color: var(--ink); text-decoration: none; margin: 0 0.3rem; }
        footer a:hover { background: var(--accent); }

        @media (max-width: 760px) {
            .points, .tpl-grid, .guard, .uc-grid { grid-template-columns: 1fr; }
            .nav-cta { display: none; }
        }
    </style>

        var html = '';
        html += '<section class="feat-hero">';
        html += '  <span class="label">Feature · ' + (ORDER.indexOf(id) + 1 < 10 ? '0' : '') + (ORDER.indexOf(id) + 1) + ' / ' + ORDER.length + '</span>';
        html += '  <div class="feat-icon">' + svg(id) + '</div>';
        if (f.tag) html += '  <span class="feat-tag">' + t(f.tag) + '</span>';
        html += '  <h1>' + t(f.title) + '</h1>';
        html += '  <p class="feat-lede">' + t(f.lede) + '</p>';
        html += '</section>';

        html += '<section class="feat-body">';

        // Highlights
        html += '<div class="feat-section"><span class="label">' + (L === 'zh' ? '核心能力' : 'Highlights') + '</span><div class="points">';
        f.points.forEach(function (p) {
            html += '<div class="point"><h3>' + t(p.title || p) + '</h3><p>' + t(p.body || p) + '</p></div>';
        });
        html += '</div></div>';

        // How it works
        if (f.how) {
            html += '<div class="feat-section"><span class="label">' + (L === 'zh' ? '工作原理' : 'How It Works') + '</span><div class="how"><p>' + t(f.how) + '</p></div></div>';
        }

        // Use cases
        if (f.usecases) {
            html += '<div class="feat-section"><span class="label">' + (L === 'zh' ? '使用场景' : 'Use Cases') + '</span><div class="uc-grid">';
            f.usecases.forEach(function (uc) {
                html += '<div class="uc"><h3>' + t(uc.title) + '</h3><p>' + t(uc.body) + '</p></div>';
            });
            html += '</div></div>';
        }

        // Templates (project-space)
        if (f.templates) {
            html += '<div class="feat-section"><span class="label">' + (L === 'zh' ? '开箱模板' : 'Ready-made Templates') + '</span><div class="tpl-grid">';
            f.templates.forEach(function (tp) {
                html += '<div class="tpl"><div class="tpl-emoji">' + tp.emoji + '</div><div><h3>' + t(tp.name) + '</h3><p>' + t(tp.desc) + '</p></div></div>';
            });
            html += '</div></div>';
        }

        // Example (project-space)
        if (f.example) {
            html += '<div class="feat-section"><span class="label">' + (L === 'zh' ? '真实工作流' : 'How a Run Looks') + '</span><div class="flow">';
            var steps = [
                { b: L === 'zh' ? '你下目标' : 'You set a goal', p: t(f.example) },
                { b: L === 'zh' ? '管理智能体拆解' : 'Admin decomposes', p: L === 'zh' ? '把目标拆成可执行的子任务清单，并规划依赖顺序。' : 'Splits the goal into executable subtasks with dependency order.' },
                { b: L === 'zh' ? '专家执行' : 'Specialists execute', p: L === 'zh' ? '每个子任务由对应专家调用真实工具（文件/Office/联网/多模态）完成。' : 'Each subtask runs by the right expert using real tools (files / Office / web / multimodal).' },
                { b: L === 'zh' ? '打分验收' : 'Score & accept', p: L === 'zh' ? '管理智能体按 0–10 打分，低于阈值自动打回重做。' : 'Admin grades 0–10; below threshold it is sent back to redo.' },
                { b: L === 'zh' ? '汇总交付' : 'Compile & deliver', p: L === 'zh' ? '成果合并成文件，群聊里可直接点击打开。' : 'Results merge into files you can open straight from the chat.' }
            ];
            steps.forEach(function (s, i) {
                html += '<div class="flow-step"><div class="flow-num">' + (i + 1) + '</div><p><b>' + s.b + '.</b> ' + s.p + '</p></div>';
            });
            html += '</div></div>';
        }

        // Guardrails (project-space)
        if (f.guardrails) {
            html += '<div class="feat-section"><span class="label">' + (L === 'zh' ? '安全护栏' : 'Safety Guardrails') + '</span><div class="guard">';
            f.guardrails.forEach(function (g) {
                html += '<div class="guard-item"><span class="dot"></span><p><b>' + t(g.b) + '</b> — ' + t(g.body) + '</p></div>';
            });
            html += '</div></div>';
        }

        html += '</section>';

        // Footer CTA
        html += '<section class="feat-foot"><h2>' + (L === 'zh' ? '想试试看？' : 'Want to try it?') + '</h2>';
        html += '<a href="index.html#download" class="btn btn-primary">' + (L === 'zh' ? '免费下载' : 'Free Download') + '</a>';
        html += '<br><a href="index.html#features" class="back-link">' + (L === 'zh' ? '← 返回全部功能' : '← Back to all features') + '</a></section>';

        document.getElementById('feat-root').innerHTML = html;
        document.title = t(f.title) + ' — Working Mate';
    }

    // 语言切换（与官网共用 localStorage）
    document.getElementById('langToggle').addEventListener('click', function () {
        var next = getLang() === 'zh' ? 'en' : 'zh';
        try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
        document.getElementById('langToggle').textContent = (next === 'zh') ? 'EN' : '中文';
        render();
    });
    (function initLang() {
        var l = getLang();
        document.getElementById('langToggle').textContent = (l === 'zh') ? 'EN' : '中文';
    })();

    render();
    </script>
</body>
</html>
