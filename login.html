    <style>
        :root {
            --bg: #f3efe6; --paper: #faf7f0; --ink: #16161a; --ink-soft: #3a3a40;
            --muted: #7a766c; --line: #16161a; --line-soft: #c9c3b3; --accent: #e8a317; --accent-d: #b8840f;
            --success: #2d6b3f; --danger: #b53d1a;
        }

        /* ── 暗色主题：墨黑底 + 米色字，琥珀保持不变（包豪斯的灵魂色） ── */
        [data-theme="dark"] {
            --bg: #16161a; --paper: #1e1e25; --ink: #f3efe6; --ink-soft: #d8d3c8;
            --muted: #948f84; --line: #f3efe6; --line-soft: #3a3a44; --accent: #e8a317; --accent-d: #f2b43a;
            --success: #57ab6e; --danger: #ff7a5c;
        }

        /* ── 主题切换按钮（包豪斯月相：纯几何） ── */
        .theme-toggle {
            position: fixed; top: 1rem; right: 1rem; z-index: 200;
            width: 34px; height: 34px;
            background: var(--bg); border: 1.5px solid var(--line);
            cursor: pointer; display: grid; place-items: center; padding: 0;
            transition: background-color .15s, border-color .15s;
        }
        .theme-toggle:hover { background: var(--accent); border-color: var(--accent); }
        .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .tt-icon {
            width: 14px; height: 14px; border-radius: 50%;
            background: transparent;
            box-shadow: inset 5px -3px 0 0 var(--ink);
            transition: box-shadow .2s, background-color .2s;
        }
        [data-theme="dark"] .tt-icon { background: var(--accent); box-shadow: none; }
        .theme-toggle:hover .tt-icon { box-shadow: inset 5px -3px 0 0 #16161a; }
        [data-theme="dark"] .theme-toggle:hover .tt-icon { box-shadow: none; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 2rem; line-height: 1.55;
        }
        a { color: inherit; }
        ::selection { background: var(--accent); color: var(--ink); }

        .card {
            background: var(--paper); border: 1.5px solid var(--line);
            padding: 2.4rem 2.2rem; width: 100%; max-width: 440px;
        }
        .logo {
            display: flex; align-items: center; gap: 0.65rem; margin-bottom: 1.6rem;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--ink);
        }
        .logo img { width: 30px; height: 30px; display: block; }

        .label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
            color: var(--ink); display: inline-flex; align-items: center; gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .label::before { content: ""; width: 8px; height: 8px; background: var(--accent); display: inline-block; }

        .card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--ink); letter-spacing: -0.01em; }
        .card .sub { color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 1.5rem; }

        .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1.5px solid var(--line); }
        .tab {
            flex: 1; text-align: center; padding: 0.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
            cursor: pointer; color: var(--ink); transition: 0.15s; border: none; background: transparent;
        }
        .tab.active { background: var(--ink); color: var(--bg); }

        .field { margin-bottom: 1rem; }
        .field label {
            display: block; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink); margin-bottom: 0.4rem;
        }
        .field input, .field select {
            width: 100%; background: var(--bg); border: 1.5px solid var(--line);
            padding: 0.75rem 0.9rem; color: var(--ink);
            font-family: 'Inter', sans-serif; font-size: 0.95rem;
        }
        .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
        .phone-row { display: flex; gap: 0.5rem; }
        .phone-row select { width: 130px; flex-shrink: 0; }

        .btn {
            width: 100%; background: var(--ink); color: var(--bg); border: 1.5px solid var(--ink);
            padding: 0.8rem; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            cursor: pointer; margin-bottom: 0.8rem;
        }
        .btn:hover { background: var(--accent); color: var(--ink); border-color: var(--accent); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.ghost { background: transparent; color: var(--ink); }
        .btn.ghost:hover { background: var(--ink); color: var(--bg); }

        .msg { font-size: 0.84rem; margin-bottom: 1rem; min-height: 1.2rem; }
        .msg.ok { color: var(--success); }
        .msg.err { color: var(--danger); }
        .hidden { display: none !important; }

        .account { text-align: center; }
        .account .avatar {
            width: 64px; height: 64px;
            background: var(--accent); color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700;
            margin: 0 auto 1rem;
        }
        .account .info { color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 1.5rem; line-height: 1.6; }
        .account .info b { color: var(--ink); }

        .back { text-align: center; margin-top: 1rem; }
        .back a { color: var(--ink); font-size: 0.84rem; text-decoration: none; border-bottom: 1.5px solid var(--line); padding-bottom: 1px; }
        .back a:hover { background: var(--accent); }
    
        /* ── 第三方登录按钮 ── */
        .providers{display:flex;flex-direction:column;gap:10px;margin:18px 0 0}
        .pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
            padding:12px 14px;border:1px solid var(--line-soft);border-radius:10px;
            background:transparent;color:var(--ink);font-size:14px;font-weight:600;
            cursor:pointer;transition:.18s;font-family:inherit}
        .pbtn:hover{border-color:var(--accent);background:rgba(232,163,23,.10);transform:translateY(-1px)}
        .pbtn svg{width:18px;height:18px;flex:none}
        .or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
        .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-soft)}
        .pnote{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center}
        .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
            background:var(--accent);color:#16161a;font-weight:700;margin-left:6px}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        /* ══════════════════════════════════════════════════════════
           Working Mate 登录 / 注册（Supabase）
           海外：Google / Apple / 邮箱 / GitHub
           大陆：手机号 + 验证码 / 微信
           配置全部在 site-config.js，本文件不含任何密钥。
           ══════════════════════════════════════════════════════════ */
        var CFG = window.WM_CONFIG || {};

        /* ── App 模式：桌面端打开本页并带着 port/state，登录完成后回传本机 ── */
        var QP = new URLSearchParams(location.search);
        var APP_PORT = QP.get("port") || "";
        var APP_STATE = QP.get("state") || "";
        var APP_MODE = QP.get("app") === "1" && !!APP_PORT;

        /* 登录成功 → 把 token 转发给桌面端的本机回调端口 */
        function forwardToApp(sess) {
            if (!sess) return false;
            var q = new URLSearchParams();
            q.set("state", APP_STATE);
            q.set("access_token", sess.access_token || "");
            q.set("refresh_token", sess.refresh_token || "");
            q.set("expires_in", String(sess.expires_in || 3600));
            var u = sess.user || {};
            q.set("user_id", u.id || "");
            var back = "http://127.0.0.1:" + APP_PORT + "/cb?" + q.toString();
            setMsg(LANG === "zh" ? "登录成功 ✓ 正在返回 Working Mate 应用（本页可关闭）"
                                 : "Signed in ✓ returning to the Working Mate app (you can close this page)", "ok");
            var b = document.getElementById("mainBtn");
            if (b) b.disabled = true;
            location.replace(back);
            return true;
        }

        /* 文案（zh/en，按地区自动切换）*/
        var STR = {
            zh: {
                title: "登录 / 注册",
                sub: "无需密码。验证码或第三方账号即可，新账号会自动创建。",
                or: "或", email: "邮箱地址", phone: "手机号", code: "验证码",
                phEmail: "you@example.com", phPhone: "138 0000 0000", phCode: "6 位数字验证码",
                send: "发送验证码", verify: "验证并登录", back: "返回修改账号",
                google: "使用 Google 登录", apple: "使用 Apple 登录",
                github: "使用 GitHub 登录", wechat: "使用微信登录",
                note: "注册即代表同意《服务条款》与《隐私政策》。新账号自动赠送 3000 积分。",
                needContact: "请输入手机号", sending: "正在发送验证码…", verifyIng: "正在验证…",
                sent: "验证码已发送，请查收", okLogin: "登录成功",
                wechatOff: "微信登录尚未配置，请先在 site-config.js 填写 wechat.authFunctionUrl",
                logged: "已登录", logout: "退出登录", uid: "用户 ID",
                provider: "登录方式", credits: "积分", syncNote: "积分与会员档位将在服务端同步后显示。",
                serviceOff: "登录服务尚未配置，请先填写 site-config.js"
            },
            en: {
                title: "Sign in / Sign up",
                sub: "No password needed. Use a code or a third-party account — new accounts are created automatically.",
                or: "or", email: "Email address", phone: "Phone number", code: "Verification code",
                phEmail: "you@example.com", phPhone: "138 0000 0000", phCode: "6-digit code",
                send: "Send code", verify: "Verify & sign in", back: "Change account",
                google: "Continue with Google", apple: "Continue with Apple",
                github: "Continue with GitHub", wechat: "Continue with WeChat",
                note: "By signing up you agree to the Terms and Privacy Policy. New accounts get 3,000 credits.",
                needContact: "Please enter your phone number", sending: "Sending code…", verifyIng: "Verifying…",
                sent: "Code sent — check your inbox", okLogin: "Signed in",
                wechatOff: "WeChat login is not configured yet (set wechat.authFunctionUrl in site-config.js)",
                logged: "Signed in", logout: "Sign out", uid: "User ID",
                provider: "Sign-in method", credits: "Credits", syncNote: "Credits and plan will appear once server sync is live.",
                serviceOff: "Auth service not configured — fill in site-config.js first"
            }
        };

        var ICON = {
            google: '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>',
            apple: '<svg viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-36.8-2.8-77 21.3-91.7 21.3-15.5 0-51.1-20.3-79.1-20.3C61.2 141.2 8 184.8 8 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 62 126.9 113.4 125.3 26.8-.8 45.7-19.3 80.7-19.3 33.9 0 51.2 19.3 81.6 19.3 51.4-.8 96.8-79.2 108.9-115.9-69.9-33-88.3-67.4-88.3-95.4zm-88.9-176.9c15.5-18.9 25.9-44.4 23-71.8-24.3 1.4-51.6 16.6-67.9 35.1-13.9 16.1-26.4 42.4-23.1 69.1 26.6 2 50.4-13.4 68-32.4z"/></svg>',
            github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
            wechat: '<svg viewBox="0 0 24 24"><ellipse cx="9.5" cy="9" rx="6.5" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="15.5" cy="15.2" rx="5.5" ry="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="8" r="1" fill="currentColor"/><circle cx="13.8" cy="14" r=".9" fill="currentColor"/><circle cx="17.3" cy="14" r=".9" fill="currentColor"/></svg>'
        };

        var LANG = "zh";
        var STEP = "send";      // send → verify
        var CHANNEL = "email";  // email | phone
        var sbClient = null;

        function ready() { return !!(window.WM_AUTH_READY && window.supabase); }
        function sb() {
            if (!sbClient) sbClient = window.supabase.createClient(CFG.supabase.url, CFG.supabase.anonKey);
            return sbClient;
        }
        function t(k) { return (STR[LANG] && STR[LANG][k]) || (STR.en[k]) || k; }
        function setMsg(x, cls) {
            var m = document.getElementById("msg");
            m.textContent = x || ""; m.className = "msg " + (cls || "");
        }
        function $(id) { return document.getElementById(id); }

        function pickLang() {
            var r = document.documentElement.getAttribute("data-region");
            LANG = (r === "CN") ? "zh" : "en";
        }

        function applyLang() {
            pickLang();
            if (APP_MODE) {
                var el = document.getElementById("lgSub");
                if (el) el.textContent = LANG === "zh"
                    ? "正在为桌面应用登录：完成任意一种登录后，应用会自动解锁。"
                    : "Signing in for the desktop app: the app unlocks automatically once you finish.";
            }
            $("lgTitle").textContent = t("title");
            $("lgSub").textContent = t("sub");
            $("orText").textContent = t("or");
            $("lbEmail").textContent = t("email");
            $("lbPhone").textContent = t("phone");
            $("lbCode").textContent = t("code");
            $("emailInput").placeholder = t("phEmail");
            $("phoneInput").placeholder = t("phPhone");
            $("codeInput").placeholder = t("phCode");
            $("mainBtn").textContent = (STEP === "send") ? t("send") : t("verify");
            $("backBtn").textContent = t("back");
            $("lgNote").textContent = t("note");
        }

        /* ── 按地区渲染第三方登录按钮 ── */
        function renderProviders() {
            pickLang();
            var region = document.documentElement.getAttribute("data-region") || "";
            var list = (CFG.providers && CFG.providers[region]) || CFG.defaultProviders || ["email"];
            var formHas = { email: false, phone: false };
            var box = $("oauthBox");
            box.innerHTML = "";

            list.forEach(function (pr) {
                if (pr === "email" || pr === "phone") { formHas[pr] = true; return; }
                var b = document.createElement("button");
                b.className = "pbtn p-" + pr;
                b.innerHTML = (ICON[pr] || "") + "<span>" + t(pr) + "</span>";
                b.onclick = function () { startProvider(pr); };
                box.appendChild(b);
            });

            // 表单通道（邮箱 / 手机）
            CHANNEL = formHas.phone ? "phone" : "email";
            $("emailField").classList.toggle("hidden", CHANNEL !== "email");
            $("phoneField").classList.toggle("hidden", CHANNEL !== "phone");
            $("orLine").classList.toggle("hidden", box.children.length === 0);
            applyLang();
        }

        function startProvider(pr) {
            if (!ready()) { setMsg(t("serviceOff"), "err"); return; }
            if (pr === "wechat") {
                var wu = CFG.wechat && CFG.wechat.authFunctionUrl;
                if (!wu) { setMsg(t("wechatOff"), "err"); return; }
                setMsg("正在跳转微信授权…");
                location.href = wu + "?redirect=" + encodeURIComponent(
                    location.origin + "/" + (CFG.redirectAfterLogin || "index.html"));
                return;
            }
            setMsg("跳转 " + pr + " 授权…");
            var red = location.origin + "/" + (CFG.redirectAfterLogin || "index.html");
            if (APP_MODE) {
                red = location.origin + "/login.html?app=1&port=" + encodeURIComponent(APP_PORT) +
                      "&state=" + encodeURIComponent(APP_STATE);
            }
            sb().auth.signInWithOAuth({
                provider: pr,
                options: { redirectTo: red }
            }).then(function (r) {
                if (r && r.error) setMsg("授权失败：" + r.error.message, "err");
            }).catch(function (e) { setMsg("授权失败：" + e.message, "err"); });
        }

        function currentContact() {
            if (CHANNEL === "email") return $("emailInput").value.trim();
            var cc = $("countryCode").value;
            var pn = $("phoneInput").value.trim();
            return pn ? (cc + pn) : "";
        }

        function resetFlow(keepMsg) {
            STEP = "send";
            $("codeField").classList.add("hidden");
            $("backBtn").classList.add("hidden");
            $("mainBtn").textContent = t("send");
            if (!keepMsg) setMsg("");
        }

        function handleMain() {
            if (!ready()) { setMsg(t("serviceOff"), "err"); return; }
            var contact = currentContact();
            if (STEP === "send") {
                if (!contact) { setMsg(CHANNEL === "email" ? "请输入邮箱" : t("needContact"), "err"); return; }
                var btn = $("mainBtn"); btn.disabled = true; setMsg(t("sending"));
                var red = location.origin + "/" + (CFG.redirectAfterLogin || "index.html");
                if (APP_MODE) {
                    red = location.origin + "/login.html?app=1&port=" + encodeURIComponent(APP_PORT) +
                          "&state=" + encodeURIComponent(APP_STATE);
                }
                var payload = CHANNEL === "email"
                    ? { email: contact, options: { shouldCreateUser: true, redirectTo: red } }
                    : { phone: contact, options: { redirectTo: red } };
                sb().auth.signInWithOtp(payload)
                    .then(function (r) {
                        btn.disabled = false;
                        if (r && r.error) { setMsg("发送失败：" + r.error.message, "err"); return; }
                        setMsg(t("sent"), "ok");
                        STEP = "verify";
                        $("codeField").classList.remove("hidden");
                        $("backBtn").classList.remove("hidden");
                        $("mainBtn").textContent = t("verify");
                        $("codeInput").focus();
                    })
                    .catch(function (e) { btn.disabled = false; setMsg("发送失败：" + e.message, "err"); });
            } else {
                var code = $("codeInput").value.trim();
                if (!code) { setMsg(t("phCode"), "err"); return; }
                var b2 = $("mainBtn"); b2.disabled = true; setMsg(t("verifyIng"));
                var arg = CHANNEL === "email"
                    ? { email: currentContact(), token: code, type: "email" }
                    : { phone: currentContact(), token: code, type: "sms" };
                sb().auth.verifyOtp(arg).then(function (r) {
                    b2.disabled = false;
                    if (r && r.error) { setMsg("验证失败：" + r.error.message, "err"); return; }
                    setMsg(t("okLogin"), "ok");
                    if (APP_MODE && r.session) { forwardToApp(r.session); return; }
                    if (r && r.user) showAccount(r.user);
                }).catch(function (e) { b2.disabled = false; setMsg("验证失败：" + e.message, "err"); });
            }
        }

        function providerOf(user) {
            var a = (user && user.app_metadata && user.app_metadata.provider) || "";
            if (a) return a;
            var id = (user && user.identities) || [];
            return id.length ? id[0].provider : "email";
        }

        function showAccount(user) {
            $("loginView").classList.add("hidden");
            $("accountView").classList.remove("hidden");
            var em = user.email || "", ph = user.phone || "";
            $("avatar").textContent = (em || ph || "?").charAt(0).toUpperCase();
            $("accTitle").textContent = t("logged");
            $("accInfo").innerHTML =
                (em ? "邮箱：<b>" + em + "</b><br>" : "") +
                (ph ? "手机：<b>" + ph + "</b><br>" : "") +
                t("provider") + "：<b>" + providerOf(user) + "</b><br>" +
                t("uid") + "：<b>" + user.id + "</b>";
            $("accNote").textContent = t("syncNote");
        }

        async function doLogout() {
            if (sbClient) await sbClient.auth.signOut();
            $("accountView").classList.add("hidden");
            $("loginView").classList.remove("hidden");
            resetFlow();
            setMsg(LANG === "zh" ? "已退出登录" : "Signed out", "ok");
        }

        var COUNTRIES = [
            ["+86", "🇨🇳 中国大陆 +86"], ["+852", "🇨🇳 中国香港 +852"], ["+853", "🇨🇳 中国澳门 +853"],
            ["+886", "🇨🇳 中国台湾 +886"], ["+1", "🇺🇸 美国/加拿大 +1"], ["+44", "🇬🇧 英国 +44"],
            ["+81", "🇯🇵 日本 +81"], ["+82", "🇰🇷 韩国 +82"], ["+65", "🇸🇬 新加坡 +65"],
            ["+60", "🇲🇾 马来西亚 +60"], ["+66", "🇹🇭 泰国 +66"], ["+61", "🇦🇺 澳大利亚 +61"],
            ["+49", "🇩🇪 德国 +49"], ["+33", "🇫🇷 法国 +33"], ["+7", "🇷🇺 俄罗斯 +7"]
        ];
        (function initCountries() {
            var sel = $("countryCode");
            COUNTRIES.forEach(function (c) {
                var o = document.createElement("option");
                o.value = c[0]; o.textContent = c[1]; sel.appendChild(o);
            });
        })();

        /* ── 启动 ── */
        (function boot() {
            if (!ready()) {
                $("loginView").classList.add("hidden");
                $("notConfigured").classList.remove("hidden");
                return;
            }
            renderProviders();
            // 地区判定是异步的，region.js 出结果后重渲染一次
            document.addEventListener("wm:region", function () { renderProviders(); });
            sb().auth.getSession().then(function (r) {
                var sess = r && r.data && r.data.session;
                if (sess) {
                    if (APP_MODE) { forwardToApp(sess); return; }
                    showAccount(sess.user);
                }
            });
            sb().auth.onAuthStateChange(function (ev, sess) {
                if (!sess || !sess.user) return;
                if (APP_MODE) { forwardToApp(sess); return; }
                showAccount(sess.user);
            });
        })();
    </script>
</body>
</html>
